<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 224" width="830" height="224" role="img" aria-label="whoami: misxnthropy. focus: infosec, defense, research. stack: python · typescript · c · c++, bash · linux · osint, ai security (details below)">
  <title>whoami</title>
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity="0.04"/></pattern><style>
    text { font-family: 'Courier New', Menlo, Consolas, monospace; }
    .jit { animation: jit 4.2s infinite steps(1); }
    .blink { animation: blink 1.1s infinite steps(1); }
    @keyframes jit { 0%,93%,100%{transform:translate(0,0)} 94%{transform:translate(-3px,1px)} 96%{transform:translate(2px,0)} 98%{transform:translate(-1px,0)} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style></defs>
  <rect x="0.5" y="0.5" width="829" height="223" rx="2" fill="#0b0b0b" stroke="#2a2a2a"/>
  <rect x="0" y="0" width="4" height="224" fill="#b3000f"/>
  <text x="28" y="30" font-size="15"><tspan fill="#b3000f">$</tspan> <tspan fill="#e8e8e8">whoami</tspan></text><text x="28" y="52" font-size="15"><tspan fill="#e8e8e8" font-weight="700">misxnthropy</tspan></text><text x="28" y="96" font-size="15"><tspan fill="#b3000f">$</tspan> <tspan fill="#e8e8e8">cat ~/focus</tspan></text><text x="28" y="120" font-size="15" fill="#8a8a8a">focus</text><text x="120" y="120" font-size="15" fill="#b3000f">:</text><text x="140" y="120" font-size="15" fill="#e8e8e8">infosec, defense, research</text><text x="28" y="144" font-size="15" fill="#8a8a8a">stack</text><text x="120" y="144" font-size="15" fill="#b3000f">:</text><text x="140" y="144" font-size="15" fill="#e8e8e8">python · typescript · c · c++</text><text x="140" y="168" font-size="15" fill="#e8e8e8">bash · linux · osint</text><text x="140" y="192" font-size="15" fill="#e8e8e8">ai security (details below)</text>
